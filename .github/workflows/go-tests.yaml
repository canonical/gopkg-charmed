# Go application tests, following the pattern of canonical/aproxy:
# formatting gate + race-detector tests, plus vet and build.
name: Go tests

on:
  pull_request:

jobs:
  go-test:
    name: Go build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests (race detector)
        run: go test -race ./...

  publish-required-context:
    name: Publish required status context
    runs-on: ubuntu-latest
    needs: go-test
    if: ${{ always() }}
    permissions:
      statuses: write
    steps:
      - name: Publish status for branch protection compatibility
        uses: actions/github-script@v9
        with:
          script: |
            const result = '${{ needs.go-test.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            const description =
              state === 'success'
                ? 'Go formatting, vet, build, and tests completed successfully.'
                : 'Go formatting, vet, build, or tests failed.';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.payload.pull_request.head.sha,
              state,
              context: 'Go tests / Go build and tests',
              description,
            });
