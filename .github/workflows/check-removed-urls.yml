name: Check for removed URLs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - ".github/workflows/check-removed-urls.yml"
  workflow_dispatch:

jobs:
  check-removed-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: compare

      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          fetch-depth: 0
          path: base

      - name: Checkout sphinx-stack helper
        uses: actions/checkout@v5
        with:
          repository: canonical/sphinx-stack
          path: sphinx-stack

      - uses: actions/setup-python@v6

      - name: Build docs for PR and base
        run: |
          for dir in compare base; do
            pushd ${dir}/docs
            make html
            popd
          done

      - name: Generate URL lists
        run: |
          for dir in compare base; do
            build_dir="${dir}/docs/_build"
            urls_file="${dir}/docs/urls.txt"

            if [ ! -d "${build_dir}" ]; then
              echo "Expected docs build directory not found: ${build_dir}"
              exit 1
            fi

            find "${build_dir}" -name '*.html' \
              | sed "s|^${build_dir}||;s|^/html||;s|/index.html$|/|;s|.html$||" \
              | sort > "${urls_file}"
          done

      - name: Compare URLs
        run: python3 sphinx-stack/docs/_dev/check_removed_urls.py
