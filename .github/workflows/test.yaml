name: Charm CI (app/charm)

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: app/charm lint (ruff, mypy, codespell)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/charm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run lint environment
        run: tox -e lint

  unit:
    name: app/charm unit tests (pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: app/charm
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install tox
        run: python -m pip install --upgrade pip tox
      - name: Run unit environment
        run: tox -e unit

  publish-required-context:
    name: app/charm required status publisher
    runs-on: ubuntu-latest
    needs: [lint, unit]
    if: ${{ always() }}
    permissions:
      statuses: write
    steps:
      - name: Publish status for branch protection compatibility
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.setFailed('Missing pull_request.head.sha; cannot publish required status context.');
              return;
            }

            const results = {
              lint: '${{ needs.lint.result }}',
              unit: '${{ needs.unit.result }}',
            };
            const notSuccessful = Object.entries(results)
              .filter(([, value]) => value !== 'success')
              .map(([name]) => name);
            const state = notSuccessful.length === 0 ? 'success' : 'failure';
            const description =
              state === 'success'
                ? 'Lint checks and unit tests completed successfully.'
                : `One or more required checks were not successful: ${notSuccessful.join(', ')}.`;

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'Tests / test / Required Test Status Checks',
              description,
            };

            const maxAttempts = 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                await github.rest.repos.createCommitStatus(payload);
                core.info(`Published required status context on attempt ${attempt}.`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  throw error;
                }
                core.warning(`Attempt ${attempt} failed: ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
              }
            }
