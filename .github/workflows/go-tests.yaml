# Go application tests, following the pattern of canonical/haproxy:
# formatting gate + race-detector tests, plus vet and build.
name: Go tests

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-test:
    name: Go build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: app/go.mod
      - name: Check formatting
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests (race detector)
        run: go test -race ./...

  publish-required-context:
    name: Publish required status context
    runs-on: ubuntu-latest
    needs: go-test
    if: ${{ always() }}
    permissions:
      statuses: write
    steps:
      - name: Publish status for branch protection compatibility
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.setFailed('Missing pull_request.head.sha; cannot publish required status context.');
              return;
            }

            const result = '${{ needs.go-test.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            const description =
              state === 'success'
                ? 'Go formatting, vet, build, and tests completed successfully.'
                : `Go formatting, vet, build, or tests were not successful: ${result}.`;

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'Go tests / Go build and tests',
              description,
            };

            const maxAttempts = 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                await github.rest.repos.createCommitStatus(payload);
                core.info(`Published required status context on attempt ${attempt}.`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  throw error;
                }
                core.warning(`Attempt ${attempt} failed: ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
              }
            }
