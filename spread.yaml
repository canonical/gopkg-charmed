project: gopkg-k8s
path: /home/ubuntu/proj
version: 1
# test_integrations deploys five charms, which leaves little room under
# spread's default 15 minutes; charm-ci's examples use the same limit.
kill-timeout: 60m

backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04
  # The same suite on Juju 4; integration-test above runs Juju 3, as PS7 does.
  integration-test-juju4:
    type: integration-test
    systems:
      - ubuntu-24.04
    environment:
      CONCIERGE: concierge-juju4.yaml
  docs:
    type: opcli-minimal
    systems:
      - ubuntu-24.04

environment:
  CONCIERGE: concierge-lxd.yaml
  # From charm-ci's spread.yaml template. charm-ci's workflows set
  # OPCLI_GIT_REF to the commit they are pinned to; this passes it into the
  # test machine, which otherwise installs opcli from charm-ci's main.
  OPCLI_GIT_REF: '$(HOST: echo "${OPCLI_GIT_REF:-main}")'

# From charm-ci's spread.yaml template: keep these out of the project copy.
exclude:
  - .git
  - .tox
  - .venv
  - .*_cache

integration-suites:
  app/charm/tests/integration/:
    summary: gopkg charm integration tests (Jubilant)
    working-dir: app/charm/
    auto-discover: true
    backends:
      - integration-test
      - integration-test-juju4
    pytest-arguments-template: |
      --no-juju-teardown
    # Canonical Kubernetes's Cilium ingress is not the cluster's default
    # class, so it ignores an Ingress that names no class.
    pytest-environment-template: |
      INGRESS_CLASS=cilium

suites:
  tests/spread/documentation/:
    summary: Executable documentation command tests
    backends:
      - docs
