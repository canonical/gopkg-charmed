project: gopkg-charmed
path: /root/proj
version: 1

backends:
  integration-test:
    type: integration-test
    systems:
      - ubuntu-24.04

environment:
  CONCIERGE: concierge-lxd.yaml

integration-suites:
  app/charm/tests/integration/:
    summary: gopkg charm pytest-operator integration tests
    working-dir: app/charm/
    auto-discover: true
    backends:
      - integration-test
    pytest-arguments-template: |
      --juju-model testing
      --no-juju-teardown
      --tb native
      -v
      -s
