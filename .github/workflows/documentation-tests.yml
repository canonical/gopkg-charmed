name: Documentation tests

on:
  # No base-branch filter: pull requests stacked on another branch must run
  # the documentation tests too, or a stacked change to a guide is never
  # exercised until it is retargeted at main.
  pull_request:
    paths:
      - "docs/how-to/**"
      - "docs/tutorials/**"
      - "tests/spread/documentation/**"
      - "app/**"
      - "artifacts.yaml"
      - "concierge-lxd.yaml"
      - "spread.yaml"
      - ".github/workflows/documentation-tests.yml"
  schedule:
    # Weekly on Saturday at 3pm UTC, alongside the integration tests, so the
    # long end-to-end run also catches tool and image drift between doc changes.
    - cron: "0 15 * * SAT"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-tests:
    uses: canonical/charm-ci/.github/workflows/doc-test.yml@0eef5b8cbef3ee74907850f790cab64bcf0499e5 # v1.0.0
    permissions:
      contents: read
      actions: read
    with:
      working-directory: .
      spread-jobs-include: "docs-ci:*"
    secrets: inherit
