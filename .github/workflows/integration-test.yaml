name: Integration Tests

on:
  pull_request:
  schedule:
    # Weekly on Saturday at 3pm UTC
    - cron: "0 15 * * SAT"

jobs:
  integration-test:
    uses: canonical/charm-ci/.github/workflows/integration-test.yml@58ae6614a3b143d4e57eff0fd1770e97d8c30fab # v1.0.1
    # charm-ci's nested jobs need these: build pushes the rock to ghcr
    # (packages: write) and reads workflow artifacts (actions: read).
    # Same grants as haproxy-operator's integration_test.yaml.
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      working-directory: .
      spread-jobs-include: "integration-test-ci:*"
    secrets: inherit

  required_status_checks:
    needs: [integration-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate integration test status
        run: |
          if [[ "${{ needs.integration-test.result }}" == "success" || "${{ needs.integration-test.result }}" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
