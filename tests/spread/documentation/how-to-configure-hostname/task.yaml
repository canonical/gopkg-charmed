summary: Execute documentation commands - configure hostname how-to, from a bare system

kill-timeout: 60m

# Cold start: no concierge, no pre-installed tools. The documentation's own
# commands install everything, so the test fails when the guide would fail.
# The prepare step only stands in for the guide's `multipass mount` step,
# which the guide marks SPREAD SKIP: it places the repository at the path
# the guide expects.
prepare: |
  chown -R ubuntu:ubuntu /home/ubuntu "${SPREAD_PATH}"
  ln -sfn "${SPREAD_PATH}" /home/ubuntu/gopkg-charm

execute: |
  "${SPREAD_PATH}/tests/spread/documentation/run-docs.sh" \
    docs/how-to/set-up-a-local-linux-environment.rst \
    docs/how-to/deploy-locally-with-microk8s.rst \
    docs/how-to/configure-hostname-and-check-go-import.rst
