name: Integration Tests

on:
  pull_request:
  # Every change to the default branch is tested, and the "Publish charm"
  # workflow publishes only trees with a successful run of this workflow.
  push:
    branches:
      - main
  schedule:
    # Weekly on Saturday at 3pm UTC
    - cron: "0 15 * * SAT"

jobs:
  integration-test:
    uses: canonical/charm-ci/.github/workflows/integration-test.yml@14b1cf49d48b9d5b96192d9bca2890c98b7295cf # v1.0.2
    # charm-ci's nested jobs need these: build pushes the rock to ghcr
    # (packages: write) and reads workflow artifacts (actions: read).
    # Same grants as haproxy-operator's integration_test.yaml.
    permissions:
      contents: read
      packages: write
      actions: read
    with:
      working-directory: .
      # Both integration backends (Juju 3 and Juju 4), not the docs backend.
      spread-jobs-include: "integration-test*-ci:*"
    secrets: inherit

  required_status_checks:
    needs: [integration-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate integration test status
        run: |
          if [[ "${{ needs.integration-test.result }}" == "success" || "${{ needs.integration-test.result }}" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
