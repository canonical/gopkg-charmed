[project]
name = "gopkg-charm"
version = "0.1.0"
description = "Juju charm for the gopkg.in versioned Go import-path service"
requires-python = ">=3.12"
# Runtime dependencies of the charm code. Keep requirements.txt in step with
# this list: the go-framework extension builds the charm with Charmcraft's
# charm plugin, which installs requirements.txt, while uv.lock records the
# exact versions this list resolves to.
dependencies = [
    "ops~=3.8",
    "paas-charm>=1.12.2,<2",
]

[tool.uv]
# The charm is not a distributable Python package; uv should manage the
# environment and the lock file only, not build or install this project.
package = false

# Testing tools configuration
[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
# Team standard: maximum of 85% and the current percentage on main.
fail_under = 85

[tool.pytest.ini_options]
minversion = "6.0"
log_cli_level = "INFO"
# Turn warnings into errors so deprecations and resource leaks fail the unit
# suite rather than accumulating unnoticed. Each ignore below is anchored to a
# specific message and is for third-party code; the charm's own code raises
# none. The integration env opts out (see tox.ini) because any warnings there
# come from the deployment tooling and are not this charm's to fix.
filterwarnings = [
    "error",
    # Raised by the vendored loki_k8s charm lib and by paas_charm; the fixes
    # belong upstream in canonical/loki-k8s-operator and canonical/paas-charm.
    "ignore:JujuVersion.from_environ\\(\\) is deprecated:DeprecationWarning",
    # paas_charm.charm_state calls pydantic's deprecated BaseModel.dict();
    # the fix belongs upstream in canonical/paas-charm.
    "ignore:The `dict` method is deprecated; use `model_dump` instead:DeprecationWarning",
]

# Linting tools configuration
[tool.ruff]
line-length = 99
lint.select = ["E", "W", "F", "C", "N", "D", "I001"]
lint.ignore = [
    "D105",
    "D107",
    "D203",
    "D204",
    # D205/D213 ignored per platform-engineering-charm-template: the team's
    # arrange/act/assert test docstring format (repo-compliance.md) starts on
    # the second line with no summary-line/blank-line separation.
    "D205",
    "D213",
    "D215",
    "D400",
    "D404",
    "D406",
    "D407",
    "D408",
    "D409",
    "D413",
]
extend-exclude = ["__pycache__", "*.egg_info"]
# Tests additionally ignore docstring summary rules (D212/D415/D417 per the
# template) and imperative-mood D401, which the standards' own fixture
# docstring examples ("The current test model.") do not satisfy.
lint.per-file-ignores = {"tests/*" = ["D100","D101","D102","D103","D104","D212","D401","D415","D417"]}

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.codespell]
skip = "build,lib,venv,icon.svg,.tox,.git,.mypy_cache,.ruff_cache,.coverage"

[tool.pyright]
include = ["src/**.py"]

[tool.mypy]
check_untyped_defs = true
disallow_untyped_defs = true
# paas-charm ships without type stubs.
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.bandit]
exclude_dirs = ["tests", "lib", ".tox", "build"]
