version_schema: 2

changes:
  - title: Published the charm to the latest/edge channel on every push to main
    author: minulo
    type: minor
    description: Added a publication workflow that, after every push to main, takes the charm and rock built and tested by the most recent successful integration-test run for that source tree, uploads the rock as the app-image resource, and releases the charm to the latest/edge channel declared in artifacts.yaml. The workflow can also be started by hand to publish to another channel, such as promoting a tested revision to latest/stable, or to validate without uploading. The integration tests now run on every push to main as well, so publication always has a tested tree to ship.
    urls:
      pr:
        - "https://github.com/canonical/gopkg-charmed/pull/35"
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Added integration tests for every charm endpoint
    author: minulo
    type: minor
    description: Added a test module that integrates each of the charm's endpoints with a published counterpart and checks that both applications settle in active. The ingress endpoint is tested with nginx-ingress-integrator, including a health check routed through the ingress controller; logging with loki-k8s; metrics-endpoint with prometheus-k8s, including a check that Prometheus registers a scrape target for the charm; and grafana-dashboard with grafana-k8s. The observability charms are published for amd64 only, so those tests are skipped on arm64 hosts.
    urls:
      pr:
        - "https://github.com/canonical/gopkg-charmed/pull/35"
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Added metrics, structured logs, a Grafana dashboard, and alert rules for the Canonical Observability Stack
    author: minulo
    type: minor
    description: The service now exposes Prometheus metrics for requests, upstream GitHub and godoc.org calls, the refs cache, and git upload-pack traffic, at the framework's metrics path on the application port or on a separate port when the metrics-port option differs, which keeps the endpoint off the hostname ingress publishes. Logs are structured JSON records that Pebble forwards to Loki. The charm ships a gopkg Overview Grafana dashboard and Prometheus and Loki alert rules for scrape failures, server errors, latency, GitHub failures, application termination, and error-log spikes. A new how-to guide covers integrating with the Canonical Observability Stack, and the reference documents the endpoints, metrics, logs, and alert rules.
    urls:
      pr:
        - "https://github.com/canonical/gopkg-charmed/pull/35"
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Built and published artifacts for AMD64 only
    author: minulo
    type: minor
    description: The build plan listed an arm64 rock without the runner labels that would place it on an arm64 machine, so that job ran on an amd64 runner, built a second amd64 rock, and overwrote the amd64 image tag. No arm64 rock was ever produced. The build plan now declares amd64 alone, which halves the rock build and removes the race on the image tag. The rock and charm recipes declare amd64 alone as well; to build locally on an arm64 machine, uncomment arm64 under platforms in both recipes, as the tutorial and the platforms reference now say.
    urls:
      pr:
        - "https://github.com/canonical/gopkg-charmed/pull/35"
      related_doc:
      related_issue:
    visibility: public
    highlight: false
  - title: Prepared the charm's metadata and documentation for the Charmhub listing review
    author: minulo
    type: minor
    description: The charm's links now include a website and give the source and issues links as single URLs, which is the form the Charmhub listing review checks. The explanation of the gopkg.in service gained a section on how a deployment differs from the public service, covering TLS termination at the ingress, configuration through charm options, the in-memory references cache, and the published architecture. The tutorial now says how to deploy the published charm from Charmhub instead of building it. The traffic loop in the observability guide now ends by itself with a success status, so the commands after it run.
    urls:
      pr:
        - "https://github.com/canonical/gopkg-charmed/pull/35"
      related_doc:
      related_issue:
    visibility: public
    highlight: false
