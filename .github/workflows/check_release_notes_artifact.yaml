name: "Check for release notes artifact"

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - labeled
      - unlabeled

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-change-artifacts:
    name: Validate release note policy
    uses: canonical/release-notes-automation/.github/workflows/pr-compliance.yml@main
    secrets: inherit
    with:
      change-artifact-dir: docs/release-notes/artifacts

  publish-required-context:
    name: Publish required status context
    runs-on: ubuntu-latest
    needs: check-change-artifacts
    if: ${{ always() }}
    permissions:
      statuses: write
    steps:
      - name: Publish status for branch protection compatibility
        uses: actions/github-script@v7
        with:
          script: |
            const sha = context.payload.pull_request?.head?.sha;
            if (!sha) {
              core.setFailed('Missing pull_request.head.sha; cannot publish required status context.');
              return;
            }

            const result = '${{ needs.check-change-artifacts.result }}';
            const state = result === 'success' ? 'success' : 'failure';
            const description =
              state === 'success'
                ? 'Release note artifact requirement satisfied or explicitly opted out.'
                : `Release note artifact requirement was not successful: ${result}.`;

            const payload = {
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha,
              state,
              context: 'Check for release notes artifact / check-change-artifacts / check-release-note-artifact',
              description,
            };

            const maxAttempts = 3;
            for (let attempt = 1; attempt <= maxAttempts; attempt += 1) {
              try {
                await github.rest.repos.createCommitStatus(payload);
                core.info(`Published required status context on attempt ${attempt}.`);
                break;
              } catch (error) {
                if (attempt === maxAttempts) {
                  throw error;
                }
                core.warning(`Attempt ${attempt} failed: ${error.message}`);
                await new Promise((resolve) => setTimeout(resolve, attempt * 2000));
              }
            }
