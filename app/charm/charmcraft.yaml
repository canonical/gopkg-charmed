name: gopkg-k8s

type: charm

base: ubuntu@24.04

title: gopkg.in - a 12-Factor Application

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
#
# Both architectures build locally. The published charm and its app-image
# resource are amd64 only: the build plan in artifacts.yaml decides that, not
# this list. Building on an architecture missing here fails with "No build
# matches the current execution environment".
platforms:
  amd64:
  arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A 12-Factor charm for the gopkg.in versioned import-path service.

# (Required)
description: |
  gopkg.in gives Go programs stable, major-version-specific import paths. An
  import such as gopkg.in/yaml.v2 names major version 2 of the go-yaml/yaml
  repository; the service resolves it to the newest matching tag on GitHub,
  answers the Go tool's go-import discovery request, and relays the Git
  fetch. Code that already imports these paths keeps needing the service,
  because Go modules did not retire import paths that were published before
  them.

  This charm deploys and operates that service on Kubernetes with Juju. It
  runs the workload as a rock, sets the public hostname the service writes
  into its go-import metadata, connects it to an ingress, and integrates it
  with the Canonical Observability Stack for metrics, logs, a dashboard and
  alert rules.

  Canonical maintains this charm to run the public gopkg.in service. A
  deployment serves imports of the hostname it is configured with, not of
  gopkg.in itself, so anyone can operate their own copy under their own
  name: as a mirror for a network that cannot reach gopkg.in, or to offer
  versioned import paths for GitHub repositories under another domain.

links:
  # One URL each, as plain strings: the Charmhub listing review reads every
  # value here as a single URL and reports a list as unreachable.
  source: https://github.com/canonical/gopkg-charmed
  issues: https://github.com/canonical/gopkg-charmed/issues
  website: https://gopkg.in
  documentation: https://canonical.com/juju/docs/gopkg-charm/latest/
  contact:
    - https://matrix.to/#/#charmhub-charmdev:ubuntu.com
    - minh.nguyen@canonical.com

extensions:
  - go-framework

