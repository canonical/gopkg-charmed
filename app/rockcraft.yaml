name: gopkg
base: bare
build-base: ubuntu@24.04
version: '0.1'
summary: Stable APIs for the Go language
description: The gopkg.in versioned-import-path redirector.
license: BSD-2-Clause
# amd64 only, matching the charm: this rock is published as the charm's
# amd64 app-image resource. Uncomment arm64 to build the rock locally there.
platforms:
  amd64:
  # arm64:
extensions:
  - go-framework
parts:
  go-framework/install-app:
    build-environment:
      - CGO_ENABLED: "0"
