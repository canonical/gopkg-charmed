name: gopkg-k8s

type: charm

base: ubuntu@24.04

title: gopkg.in 12-Factor Operator

# the platforms this charm should be built on and run on.
# you can check your architecture with `dpkg --print-architecture`
#
# amd64 only: the published charm and its app-image resource are amd64, and the
# observability charms it integrates with are published for amd64 only. Building
# on another architecture fails with "No build matches the current execution
# environment" - add that architecture here to build locally.
platforms:
  amd64:
  # arm64:
  # ppc64el:
  # s390x:

# (Required)
summary: A 12-Factor charm for the gopkg.in versioned import-path service.

# (Required)
description: |
  Deploy and operate gopkg.in on Kubernetes with a 12-Factor workflow.
  This charm uses the Go framework extension and manages the gopkg.in
  workload with Juju-native configuration and integrations.

links:
  source:
    - https://github.com/canonical/gopkg-charmed
  issues:
    - https://github.com/canonical/gopkg-charmed/issues
  # Point at the published documentation once it is publicly reachable.
  documentation: https://github.com/canonical/gopkg-charmed#readme
  contact:
    - https://matrix.to/#/#charmhub-charmdev:ubuntu.com
    - minh.nguyen@canonical.com

extensions:
  - go-framework

