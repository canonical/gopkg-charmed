version: 1
rocks:
  - name: gopkg
    rockcraft-yaml: app/rockcraft.yaml
    # amd64 only. app/rockcraft.yaml also declares arm64, for local builds.
    # An arm64 entry here would also need `runner:` with arm64 labels; without
    # it opcli puts the job on an amd64 runner, where rockcraft builds an amd64
    # rock and overwrites the amd64 tag.
    platforms:
      - arch: amd64
charms:
  # No `platforms:` key: opcli defaults to a single amd64 build.
  - name: gopkg-k8s
    charmcraft-yaml: app/charm/charmcraft.yaml
    channel: latest/edge
    resources:
      app-image:
        type: oci-image
        rock: gopkg
