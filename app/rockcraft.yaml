name: gopkg
base: bare
build-base: ubuntu@24.04
version: '0.1'
summary: Stable APIs for the Go language
description: The gopkg.in versioned-import-path redirector.
license: BSD-2-Clause
# Both architectures build locally. CI builds and publishes amd64 only: the
# build plan in artifacts.yaml decides that, not this list.
platforms:
  amd64:
  arm64:
extensions:
  - go-framework
parts:
  go-framework/install-app:
    build-environment:
      - CGO_ENABLED: "0"
    # `go install` names the binary after the last element of the module
    # path, gopkg-charmed, while the extension starts the rock's name, gopkg.
    # This mapping keeps the service command and the image unchanged.
    organize:
      bin/gopkg-charmed: usr/local/bin/gopkg
