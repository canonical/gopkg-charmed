summary: Execute documentation commands - deployment tutorial
kill-timeout: 30m

prepare: |
  opcli install concierge
  opcli install charmcraft
  opcli install rockcraft
  opcli env provision -c "${SPREAD_PATH}/concierge-lxd.yaml"
  chown -R ubuntu:ubuntu /home/ubuntu "${SPREAD_PATH}"
  ln -sfn "${SPREAD_PATH}" /home/ubuntu/gopkg-charm

execute: |
  script=/tmp/documentation-commands.sh
  opcli tutorial expand -- \
    "${SPREAD_PATH}/docs/tutorials/deploy-and-verify-on-kubernetes.rst" \
    > "${script}"
  runuser -l ubuntu -s /bin/bash -c \
    'set -euxo pipefail; . "$1"' _ "${script}"
