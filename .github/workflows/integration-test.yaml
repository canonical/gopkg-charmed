# Runs the pytest-operator integration suite (app/charm/tests/integration)
# via operator-workflows, which builds the charm and rock and provides a
# MicroK8s cloud. Replaces the earlier charm-ci spread wiring: spread
# requires a spread.yaml and task suites this repo does not define, whereas
# the pytest-operator tests already exist.
name: Integration Tests

on:
  pull_request:
  schedule:
    # Weekly on Saturday at 3pm UTC
    - cron: "0 15 * * SAT"

jobs:
  integration-test:
    uses: canonical/operator-workflows/.github/workflows/integration_test.yaml@main
    secrets: inherit
    with:
      working-directory: ./app/charm/
      charm-directory: .
      provider: microk8s
      channel: 1.32-strict/stable
      juju-channel: 3.6/stable
      modules: '["test_charm"]'

  required_status_checks:
    needs: [integration-test]
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate integration test status
        run: |
          if [[ "${{ needs.integration-test.result }}" == "success" || "${{ needs.integration-test.result }}" == "skipped" ]]; then
            exit 0
          else
            exit 1
          fi
