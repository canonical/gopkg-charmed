# Concierge provisioning config for LXD + Juju integration tests.
# See: CICD_SYSTEM.md §7.2 for the monorepo example.

juju:
  channel: 3/stable
  model-defaults:
    test-mode: "true"
    automatically-retry-hooks: "false"

providers:
  lxd:
    enable: true
    bootstrap: false
  microk8s:
    enable: true
    bootstrap: true
    # Same channel the documentation instructs readers to install
    # (docs/how-to/set-up-a-local-linux-environment.rst, Step 3).
    channel: 1.36-strict/stable
    addons:
      - dns
      - hostpath-storage
      - registry
      - ingress

host:
  snaps:
    charmcraft:
      channel: latest/stable
      classic: true
