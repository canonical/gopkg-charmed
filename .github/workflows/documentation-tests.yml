name: Documentation tests

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/how-to/**"
      - "docs/tutorials/**"
      - "tests/spread/documentation/**"
      - "app/**"
      - "artifacts.yaml"
      - "concierge-lxd.yaml"
      - "spread.yaml"
      - ".github/workflows/documentation-tests.yml"
  schedule:
    # Weekly on Saturday at 3pm UTC, alongside the integration tests, so the
    # long end-to-end run also catches tool and image drift between doc changes.
    - cron: "0 15 * * SAT"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  documentation-tests:
    uses: canonical/charm-ci/.github/workflows/doc-test.yml@58ae6614a3b143d4e57eff0fd1770e97d8c30fab # v1.0.1
    permissions:
      contents: read
      actions: read
    with:
      working-directory: .
      spread-jobs-include: "docs-ci:*"
    secrets: inherit
