name: Check for removed URLs

on:
  pull_request:
    branches: [main]
    paths:
      - "docs/**"
      - ".readthedocs.yaml"
      - ".github/workflows/check-removed-urls.yml"
  workflow_dispatch:

jobs:
  check-removed-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          path: compare

      - name: Checkout base branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          fetch-depth: 0
          path: base

      - name: Checkout sphinx-stack helper
        uses: actions/checkout@v5
        with:
          repository: canonical/sphinx-stack
          path: sphinx-stack

      - uses: actions/setup-python@v6

      - name: Build docs for PR and base
        run: |
          pushd compare/docs
          make html
          popd

          if [ -f "base/docs/Makefile" ]; then
            pushd base/docs
            make html
            popd
          else
            echo "Base branch does not have docs Makefile; treating base URL set as empty."
          fi

      - name: Generate URL lists
        run: |
          compare_build_dir="compare/docs/_build"
          compare_urls_file="compare/docs/urls.txt"

          if [ ! -d "${compare_build_dir}" ]; then
            echo "Expected docs build directory not found: ${compare_build_dir}"
            exit 1
          fi

          find "${compare_build_dir}" -name '*.html' \
            | sed "s|^${compare_build_dir}||;s|^/html||;s|/index.html$|/|;s|.html$||" \
            | sort > "${compare_urls_file}"

          base_build_dir="base/docs/_build"
          base_urls_file="base/docs/urls.txt"

          if [ -d "${base_build_dir}" ]; then
            find "${base_build_dir}" -name '*.html' \
              | sed "s|^${base_build_dir}||;s|^/html||;s|/index.html$|/|;s|.html$||" \
              | sort > "${base_urls_file}"
          else
            echo "No base docs build directory found; writing empty base URL set."
            mkdir -p base/docs
            : > "${base_urls_file}"
          fi

      - name: Compare URLs
        run: python3 sphinx-stack/docs/_dev/check_removed_urls.py
