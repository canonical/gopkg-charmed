<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100" role="img" aria-label="Gopkg charm icon">
  <title>Gopkg</title>

  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="0.65" y2="1">
      <stop offset="0" stop-color="#2E4372"/>
      <stop offset="1" stop-color="#1B2440"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.3" cy="0.22" r="0.75">
      <stop offset="0" stop-color="#7C93C8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7C93C8" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <circle cx="50" cy="50" r="50" fill="url(#field)"/>
  <circle cx="50" cy="50" r="50" fill="url(#sheen)"/>

  <!-- seam revealed by the lifted lid -->
  <polygon points="26,36 74,36 74,33.5 26,33.5" fill="#E8A33D"/>

  <!-- lid, lifted -->
  <polygon points="50,20 74,34 26,34" fill="#FFFFFF"/>

  <!-- upper face -->
  <polygon points="26,36 74,36 50,50" fill="#FFFFFF" opacity="0.93"/>

  <!-- left face -->
  <polygon points="26,36 50,50 50,78 26,64" fill="#FFFFFF" opacity="0.78"/>

  <!-- right face -->
  <polygon points="74,36 50,50 50,78 74,64" fill="#FFFFFF" opacity="0.52"/>
</svg>
