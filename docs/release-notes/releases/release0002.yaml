# --- Information about release ----

version_schema: 2

# Four-digit release number; it names the rendered page
# (release-notes-<NNNN>.md) and its anchor.
release_number: "0002"

# Workload name and version, for example "gopkg.in 1.0".
workload_with_version: gopkg.in 0.1

# Optional paragraph after the introduction, for what sets this release apart.
summary: >-
  This is the first release since the
  {ref}`initial documentation baseline <release_notes_release_notes_0001>`.
  The charm is now published to the latest/edge channel on every push to main,
  and it integrates with the Canonical Observability Stack through metrics,
  structured logs, a Grafana dashboard, and alert rules. The documentation
  gained a rewritten tutorial around the published charm, guides for
  upgrading the charm and for integrating with COS Lite, and Terraform
  modules for deploying with Juju.

# Rows of the requirements table, for example "3.6", "MicroK8s 1.36", "24.04".
juju_version: "3.6"
kubernetes_version: MicroK8s 1.36
ubuntu_version: "24.04"

# Change artifacts included in the release, for example pr0027.yaml.
# pr0027.yaml is covered by the hand-written release-notes-0001.rst.
included_changes:
